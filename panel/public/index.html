<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Android Mixer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230f7b52' stroke-width='2'%3E%3Crect x='6' y='2.5' width='12' height='19' rx='2.5'/%3E%3Cpath d='M10.5 18.5h3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>
    // El tema, antes de pintar nada para que no parpadee: el de ?tema=… o el guardado en este navegador. El Clásico (y la
    // Consola roja de antes) es no poner ninguno
    try {
      const theme = new URLSearchParams(location.search).get('tema') || localStorage.getItem('tema');
      if (theme && theme !== 'clasico' && theme !== 'consola') document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#/">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>
      Android Mixer
    </a>
    <!-- En el móvil, abajo y con su icono, como las pestañas de una app -->
    <nav>
      <a href="#/" data-tab="devices"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>Dispositivos</a>
      <a href="#/apps" data-tab="apps"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>Apps</a>
      <a href="#/music" data-tab="music"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>Música</a>
      <a href="#/settings" data-tab="settings"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Ajustes</a>
    </nav>
    <div class="theme-menu">
      <button id="theme-btn" class="btn ghost" aria-haspopup="menu" aria-expanded="false" title="Cambiar el tema del panel">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.9 1.2-1.8-.4-1-.1-2.2 1.2-2.2H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10z"/><circle cx="7.5" cy="11.5" r="1"/><circle cx="10.5" cy="7.5" r="1"/><circle cx="15" cy="8" r="1"/></svg>
        <span id="theme-name">Tema</span>
      </button>
      <div id="theme-list" class="theme-list" role="menu" hidden></div>
    </div>
    <button id="refresh" class="btn ghost icon" title="Actualizar">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4"/></svg>
    </button>
  </header>
  <main>
    <div id="banner"></div>
    <div id="view"></div>
  </main>
  <div id="toasts" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
  <script src="app.js"></script>
</body>
</html>
