<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Altavoz</title>
  <style>
    /* Fondo negro: en las pantallas OLED apenas gasta, y de noche casi no alumbra la habitación */
    :root { --text: #e8ebf0; --muted: #8d97a6; --accent: #3ddc84; --line: #232a33; --warn: #f3b44a; color-scheme: dark; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body { margin: 0; background: #000; color: var(--text); font: 17px/1.45 system-ui, Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    header { display: flex; justify-content: space-between; gap: 12px; padding: 14px 18px; color: var(--muted); font-size: 15px; }
    header strong { color: var(--text); font-weight: 600; }
    main { padding: 4vh 18px 24px; max-width: 640px; margin: 0 auto; text-align: center; transition: opacity .6s; }
    #state { margin: 0; color: var(--muted); }
    #state.warn { color: var(--warn); }
    h1 { margin: 6px 0 4vh; font-size: clamp(24px, 7vw, 38px); line-height: 1.2; overflow-wrap: anywhere; }
    .controls { display: flex; justify-content: center; align-items: center; gap: 22px; }
    .controls button { display: grid; place-items: center; width: 64px; height: 64px; border: 0; border-radius: 50%; background: #161b22; color: var(--text); cursor: pointer; }
    .controls button.main { width: 88px; height: 88px; background: var(--accent); color: #06301b; }
    .controls svg { width: 30px; height: 30px; fill: currentColor; }
    .controls .main svg { width: 38px; height: 38px; }
    .note { margin: 3vh 0 0; color: var(--muted); font-size: 14px; }
    .here { display: inline-flex; align-items: center; gap: 10px; margin: 2vh 0 0; padding: 10px 18px; border: 1px solid var(--line); border-radius: 999px; background: none; color: var(--text); font: inherit; cursor: pointer; }
    .here i { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); }
    .here.on i { background: var(--accent); }
    ol { margin: 4vh 0 0; padding: 0; list-style: none; text-align: left; border-top: 1px solid var(--line); }
    li button { display: block; width: 100%; padding: 14px 6px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
    li button.now { color: var(--accent); font-weight: 600; }
    .empty { padding: 16px 6px; color: var(--muted); }
    #activate { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      width: 100%; padding: 24px; border: 0; background: #000; color: var(--text); font: inherit; text-align: center; cursor: pointer; }
    #activate svg { width: 96px; height: 96px; fill: var(--accent); }
    #activate strong { font-size: 24px; }
    #activate span { max-width: 320px; color: var(--muted); }
    /* Descanso: una capa negra casi opaca encima de todo (menos de «Toca para activar»); se va con un toque y tarda en volver */
    #rest { position: fixed; inset: 0; z-index: 1; background: #000; opacity: 0; pointer-events: none; transition: opacity .3s; }
    body.rest #rest { opacity: .8; pointer-events: auto; transition-duration: 3s; }
  </style>
</head>
<body>
  <button id="activate" hidden>
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z"/></svg>
    <strong>Toca para activar el altavoz</strong>
    <span>Chrome necesita un toque antes de dejar sonar la música. Lo normal es que el panel lo dé solo.</span>
  </button>
  <div id="rest"></div>
  <header><strong id="room">Altavoz</strong><span id="link"></span></header>
  <main>
    <p id="state">Conectando con el PC…</p>
    <h1 id="title">Nada sonando</h1>
    <div class="controls">
      <button data-do="previous" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button data-do="toggle" class="main" id="toggle" aria-label="Reproducir"><svg viewBox="0 0 24 24"><path id="toggle-icon" d="M8 5v14l11-7z"/></svg></button>
      <button data-do="next" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    </div>
    <p class="note">La pausa y las canciones que elijas aquí valen para todos los altavoces.</p>
    <button class="here" id="here"><i></i><span id="here-text">Suena aquí</span></button>
    <ol id="songs"></ol>
  </main>
  <script src="speaker.js"></script>
</body>
</html>
